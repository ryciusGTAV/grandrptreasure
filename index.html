    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --accent-color: #7289da;
            --text-color: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        .filter-container {
            max-width: 800px;
            margin: 0 auto 30px auto;
            display: flex;
            justify-content: center;
        }

        input[type="text"] {
            padding: 12px 20px;
            width: 100%;
            max-width: 400px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: var(--card-bg);
            color: white;
            font-size: 16px;
        }

        .gallery-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(114, 137, 218, 0.3);
        }

        /* Tikslus telefono ekrano rėmas */
        .card-phone-screen {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-size: 435%; 
            background-position: 90.5% 64.5%; 
            background-repeat: no-repeat;
            border-bottom: 2px solid #222;
        }

        .card-info {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .location-info {
            font-size: 14px;
            color: #ccc;
        }

        .card-tags {
            font-size: 13px;
            color: #aaa;
            margin-top: 8px;
        }

        .tag {
            background: #2c2f38;
            padding: 3px 8px;
            border-radius: 4px;
            margin-right: 5px;
            display: inline-block;
            margin-top: 5px;
        }

        /* Modalinis langas peržiūrai paspaudus */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            cursor: zoom-out;
        }

        .modal-content {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        .modal-text {
            margin-top: 15px;
            font-size: 18px;
            text-align: center;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 35px;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

        function renderGallery(items) {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = '';

            items.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openModal(item.fullImg, `${item.title} - ${item.location}`);

                card.innerHTML = `
                    <div class="card-phone-screen" style="background-image: url('${item.phoneImg}');"></div>
                    <div class="card-info">
                        <div>
                            <div class="card-title">${item.title}</div>
                            <div class="location-info">📍 ${item.location}</div>
                        </div>
                        <div class="card-tags">
                            ${item.tags.split(' ').map(tag => `<span class="tag">#${tag}</span>`).join('')}
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterImages() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = treasures.filter(item => {
                return item.title.toLowerCase().includes(query) ||
                       item.location.toLowerCase().includes(query) ||
                       item.tags.toLowerCase().includes(query);
            });
            renderGallery(filtered);
        }

        function openModal(imgSrc, caption) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImg');
            const modalText = document.getElementById('modalText');
            
            modal.style.display = 'flex';
            modalImg.src = imgSrc;
            modalText.innerText = caption;
        }

        function closeModal() {
            document.getElementById('imageModal').style.display = 'none';
        }

        renderGallery(treasures);
